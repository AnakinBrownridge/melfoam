plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anakinbrownridge.melfoam'
    compileSdk 28

    defaultConfig {
        applicationId 'com.anakinbrownridge.melfoam'
        minSdk 14
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
